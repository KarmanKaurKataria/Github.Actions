name : CI test for node
on: [push]
jobs:
    build:
         runs-on: ubuntu-latest

         steps:
            - name: Check code
              uses: actions/checkout@v4


            - name: Setup code
              uses: actions/setup-node@v4
              with:
                 node-version : 18

            - name: Check Node version
              run: node -v

            - name: Run Application
              run: node index.js
            

            - name: Install dependency
              run: npm install

            - name: Run Test
              run: npm test